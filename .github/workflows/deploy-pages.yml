name: Deploy Portfolio to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "react/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install dependencies
        working-directory: react
        run: npm ci

      - name: Build React app
        working-directory: react
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          test -d react/dist
          test -f react/dist/index.html
          test -f react/dist/og-image.png
          echo "Build output verified."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy react/dist --project-name=portfolio-karthikeyan-k-u --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
